[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "0.1.0"
description = "Linux Network Troubleshooting Toolkit"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["netscope*", "linuxnetlens*"]

[project.scripts]
linuxnetlens = "linuxnetlens.cli:main"